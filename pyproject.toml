[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dbackup-mcp"
version = "0.1.0"
description = "A typed Model Context Protocol server for curated DBackup backup administration through its authenticated API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ronald de Wit" }]
keywords = ["dbackup", "backup", "mcp", "model-context-protocol", "systems-administration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=1.12.0,<2.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
dbackup-mcp = "dbackup_mcp:main"

[project.urls]
Repository = "https://github.com/X1pheR/dbackup-mcp"
Issues = "https://github.com/X1pheR/dbackup-mcp/issues"
Upstream = "https://github.com/Skyfay/DBackup"

[tool.hatch.build.targets.wheel]
packages = ["src/dbackup_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
